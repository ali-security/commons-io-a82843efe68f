# Build and test commons-io 2.4 on JDK 6 (the release was built with
# Build-Jdk 1.6.0_31, source/target 1.6). Upstream has no GitHub Actions CI;
# this mirrors the project's own Maven build: `mvn package` with the
# commons-parent `release` profile, which is what binds jar:test-jar.
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Surefire -Dtest selector; empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download Zulu JDK 6
        run: curl -fsSL -o "$RUNNER_TEMP/zulu6.tar.gz" https://cdn.azul.com/zulu/bin/zulu6.22.0.3-jdk6.0.119-linux_x64.tar.gz

      - name: Set up JDK 6
        uses: actions/setup-java@v4
        with:
          distribution: jdkfile
          jdkFile: ${{ runner.temp }}/zulu6.tar.gz
          java-version: "6"
          architecture: x64

      - name: Install Maven 3.2.5 (last Maven release that runs on Java 6)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maven.tar.gz" https://archive.apache.org/dist/maven/maven-3/3.2.5/binaries/apache-maven-3.2.5-bin.tar.gz
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.2.5/bin" >> "$GITHUB_PATH"
          # JDK 6 cannot negotiate TLSv1.2 with Maven Central, so route every
          # repository through Central's plain-HTTP endpoint.
          cat > "$RUNNER_TEMP/settings.xml" <<'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>central-http</id>
                <mirrorOf>*</mirrorOf>
                <url>http://insecure.repo1.maven.org/maven2</url>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Build and test
        env:
          MAVEN_OPTS: -Xmx1g -XX:MaxPermSize=256m -Duser.name=ggregory
        run: |
          COMMON="-B -V -e -s $RUNNER_TEMP/settings.xml -Prelease -Dgpg.skip=true -Dmaven.javadoc.skip=true -Drat.skip=true -Dclirr.skip=true -Dcheckstyle.skip=true -Dfindbugs.skip=true -Danimal.sniffer.skip=true"
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn $COMMON clean package -Dtest='${{ inputs.test-filter }}' -DfailIfNoTests=false
          else
            mvn $COMMON clean package
          fi

      - name: Print per-test results
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          tot = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for f in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              r = ET.parse(f).getroot()
              for k in tot:
                  tot[k] += int(r.get(k, 0) or 0)
              for tc in r.iter("testcase"):
                  name = "%s.%s" % (tc.get("classname"), tc.get("name"))
                  sk = tc.find("skipped")
                  if sk is not None:
                      print("SKIPPED %s: %s" % (name, sk.get("message") or (sk.text or "").strip()))
                  elif tc.find("failure") is not None or tc.find("error") is not None:
                      print("FAILED  %s" % name)
          print("TOTAL tests=%(tests)d failures=%(failures)d errors=%(errors)d skipped=%(skipped)d" % tot)
          print("PASSED %d" % (tot["tests"] - tot["failures"] - tot["errors"] - tot["skipped"]))
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: commons-io-jars
          path: |
            target/commons-io-2.4.jar
            target/commons-io-2.4-tests.jar
          if-no-files-found: error
